<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roni</title>
    
    <link rel="icon" type="image/png" href="./assets/logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #1e293d; 
            color: #fff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 2rem 1rem;
            margin-top: 2rem;
        }

        .avatar {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 1.5rem;
            background-color: #f6efe8; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .bio {
            font-size: 1rem;
            line-height: 1.6;
            color: #d1d5db;
            text-align: justify;
            margin-bottom: 2.5rem;
            width: 100%;
        }

        .contact-section {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            font-size: 1rem;
        }

        .contact-links {
            display: flex;
            gap: 1rem;
        }

        .contact-links a {
            color: #f1f5f9;
            text-decoration: none;
            font-size: 1.5rem;
            transition: opacity 0.2s, color 0.2s;
        }

        .contact-links a:hover {
            opacity: 0.7;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <main>
        <section class="profile-card">
    
            <div class="avatar">
                <img src="./assets/logo.png" alt="Roni Logo">
            </div>

            <h1>Roni</h1>
            
            <p class="bio">
               I am an Electrical Engineering student. When I step away from the screen, I’m usually on the cricket field.
            </p>

            <div class="contact-section">
                <span>Contact --</span>
                <div class="contact-links">
                    <a href="http://github.com/roniui" aria-label="GitHub">
                        <i class="bi bi-github"></i>
                    </a>                    
                    <a href="mailto:roniui.github.io@gmail.com" aria-label="Email">
                        <i class="bi bi-envelope-at-fill"></i>
                    </a>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
